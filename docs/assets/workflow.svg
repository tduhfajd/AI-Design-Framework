<svg xmlns="http://www.w3.org/2000/svg" width="560" height="680" viewBox="0 0 560 680" role="img" aria-labelledby="title description">
  <title id="title">Как устроен процесс</title>
  <desc id="description">Discovery: задача и содержание. Direction: визуальные пробы. Выбор владельца или делегирование. Implementation: реализация. Review: экраны и сценарии. Исправления возвращаются в Implementation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#718574" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="560" height="680" rx="18" fill="#f6f3eb"/>
  <g fill="none" stroke="#718574" stroke-width="2" marker-end="url(#arrow)">
    <path d="M250 108V133"/>
    <path d="M250 232V257"/>
    <path d="M250 356V381"/>
    <path d="M250 480V505"/>
    <path d="M476 556H524V432H482"/>
  </g>
  <g fill="#ffffff" stroke="#bdc5bc">
    <rect x="24" y="20" width="452" height="88" rx="12"/>
    <rect x="24" y="144" width="452" height="88" rx="12"/>
    <rect x="24" y="392" width="452" height="88" rx="12"/>
    <rect x="24" y="512" width="452" height="88" rx="12"/>
  </g>
  <rect x="24" y="268" width="452" height="88" rx="12" fill="#e4e8df" stroke="#718574"/>
  <g font-family="Arial, sans-serif" fill="#233c34" font-size="27">
    <text x="46" y="56">Discovery</text>
    <text x="46" y="180">Direction</text>
    <text x="46" y="304">Выбор владельца</text>
    <text x="46" y="428">Implementation</text>
    <text x="46" y="548">Review</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#58675c" font-size="22">
    <text x="46" y="87">Задача и содержание</text>
    <text x="46" y="211">Визуальные пробы</text>
    <text x="46" y="335">или явное делегирование</text>
    <text x="46" y="459">Реализация</text>
    <text x="46" y="579">Экраны и сценарии</text>
    <text x="24" y="642">Замечания → возврат к реализации</text>
  </g>
</svg>
